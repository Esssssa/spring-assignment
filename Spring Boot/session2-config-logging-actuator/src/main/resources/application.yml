spring:
  application:
    name: shop

shop:
  name: Demo Shop
  currency: EGP
  page-size: 20

logging:
  level:
    com.example.shop: INFO

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics

info:
  app:
    name: Shop
    version: 1.0.0
